# Local-only dependencies that are not part of the Supabase local stack (docs/deployment.md §4).
# Postgres / Auth / Storage / Mailpit come from `pnpm exec supabase start` (supabase/config.toml).
# Ports bind to 127.0.0.1 only; nothing here is meant to be reachable from other hosts.
name: quiz-workspace-infra

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    ports:
      - '127.0.0.1:6333:6333' # HTTP / REST
      - '127.0.0.1:6334:6334' # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      QDRANT__TELEMETRY_DISABLED: 'true'
    healthcheck:
      # The image ships without curl/wget; probe /readyz over bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 &&
          head -n 1 <&3 | grep -q " 200 "'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8.10.2-alpine3.23
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 2s

volumes:
  qdrant-data:
  redis-data:
