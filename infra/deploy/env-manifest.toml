# Environment manifest (M7.4a): every variable each deployed service reads, per environment.
# Names only — never commit a value. Checked by `scripts/check_env.py` (values are validated, never
# printed) and cross-checked against the code and .env.example by scripts/test_check_env.py.
# Runbook (who generates what, where it goes): docs/runbook-deploy.md.
#
# Per variable:
#   services   where it is set (see [services])
#   kind       public  = browser-visible build value (NEXT_PUBLIC_*, docs/deployment.md §6)
#              config  = server-side, not secret (URLs, limits, flags)
#              secret  = server-only credential: never NEXT_PUBLIC_, never logged
#   required   true = staging and production; or a list of environments; default false
#   forbidden  true = must NOT be set in staging/production (test-only or unsafe switches)
#   check      value rule applied by the checker (see scripts/check_env.py CHECKS)
#   same       true = identical value on every service listed (compared by digest)
#   requires   another variable that must be set whenever this one is
#   required_when  "NAME=value": required whenever NAME has that value (M7.4b)
#   never_on   services where setting it is an error (server-only values kept off web)
#   provider   who produces the value
#   note       short reason / default

[meta]
environments = ["staging", "production"]
# APP_ENV per environment (docs/deployment.md §4: staging is the `preview` environment).
app_env = { staging = "preview", production = "production" }
# Injected by the platform; ignored by the unknown-variable warning (forbidden names still fail).
platform_prefixes = ["RAILWAY_", "VERCEL_", "NODE_", "NEXT_RUNTIME", "HOSTNAME", "PORT", "PATH", "HOME", "PWD", "TZ", "LANG", "HF_HUB_", "PYTHON", "UV_"]

[services]
web = "Vercel → Settings → Environment Variables: staging project (Preview) / separate production project (Production), both Root Directory apps/web"
api = "Railway service `api` → Variables (Railway environment staging / production)"
worker = "Railway service `worker` → Variables (Railway environment staging / production)"
deploy = "GitHub → Settings → Environments → staging / production (secrets and variables) for .github/workflows/deploy.yml"
smoke = "GitHub Environment (deploy workflow smoke step) or the operator shell for `make smoke-staging`"
supabase-config = "operator shell for `pnpm exec supabase config push` (supabase/config.toml [remotes.*])"
ops = "operator shell for `make backup` / `make restore` (never a service)"

# ------------------------------------------------------------------------------------------------
# Shared
# ------------------------------------------------------------------------------------------------
[[var]]
name = "APP_ENV"
services = ["web", "api", "worker"]
kind = "config"
required = true
check = "app_env"
provider = "operator"
note = "preview (staging) / production; enables the startup guards and HSTS"

[[var]]
name = "LOG_LEVEL"
services = ["api", "worker"]
kind = "config"
check = "log_level"
provider = "default"
note = "INFO"

