name = "RAILWAY_TOKEN"
services = ["deploy"]
kind = "secret"
required = true
check = "nonempty"
provider = "Railway → project → Settings → Tokens (project token for this environment)"

[[var]]
name = "RAILWAY_ENVIRONMENT_ID"
services = ["deploy"]
kind = "config"
required = true
check = "uuid"
provider = "Railway environment id (dashboard URL / Cmd-K → copy environment id)"

[[var]]
name = "RAILWAY_API_SERVICE_ID"
services = ["deploy"]
kind = "config"
required = true
check = "uuid"
provider = "Railway service `api` id"

[[var]]
name = "RAILWAY_WORKER_SERVICE_ID"
services = ["deploy"]
kind = "config"
required = true
check = "uuid"
provider = "Railway service `worker` id"

# ------------------------------------------------------------------------------------------------
# Staging smoke (tests/smoke, `make smoke-staging`)
# ------------------------------------------------------------------------------------------------
[[var]]
name = "SMOKE_TARGET"
services = ["smoke"]
kind = "config"
required = true
check = "smoke_target"
provider = "operator / workflow"
note = "local | staging | production"

[[var]]
name = "E2E_BASE_URL"
services = ["smoke"]
kind = "config"
required = true
check = "https_origin"
provider = "the web origin under test"

[[var]]
name = "SMOKE_API_URL"
services = ["smoke"]
kind = "config"
required = true
check = "https_origin"
provider = "the API origin (= NEXT_PUBLIC_API_BASE_URL)"

[[var]]
name = "SMOKE_SUPABASE_URL"
services = ["smoke"]
kind = "config"
required = true
check = "https_url"
provider = "= NEXT_PUBLIC_SUPABASE_URL"

[[var]]
name = "SMOKE_SUPABASE_PUBLISHABLE_KEY"
services = ["smoke"]
kind = "public"
required = true
check = "publishable_key"
provider = "= NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
note = "public value; not NEXT_PUBLIC_ because no bundle reads it"

[[var]]
name = "SMOKE_USER_A_EMAIL"
services = ["smoke"]
kind = "secret"
required = ["staging"]
check = "email"
provider = "operator: dedicated confirmed smoke account (staging only)"

[[var]]
name = "SMOKE_USER_A_PASSWORD"
services = ["smoke"]
kind = "secret"
required = ["staging"]
check = "password"
provider = "operator: password manager"

[[var]]
name = "SMOKE_USER_B_EMAIL"
services = ["smoke"]
kind = "secret"
required = ["staging"]
check = "email"
provider = "operator: second confirmed smoke account (cross-user checks)"

[[var]]
name = "SMOKE_USER_B_PASSWORD"
services = ["smoke"]
kind = "secret"
required = ["staging"]
check = "password"
provider = "operator: password manager"

[[var]]
name = "SMOKE_QDRANT_URL"
services = ["smoke"]
kind = "config"
check = "https_url"
provider = "= QDRANT_URL (enables the unauthenticated-Qdrant check)"

[[var]]
name = "SMOKE_STATE_DIR"
services = ["smoke"]
kind = "config"
provider = "operator"
note = "DEP-03 seed/verify state (ids only); default test-results-smoke/"

# ------------------------------------------------------------------------------------------------
# `supabase config push` (supabase/config.toml [remotes.*])
# ------------------------------------------------------------------------------------------------
[[var]]
name = "SUPABASE_ACCESS_TOKEN"
services = ["supabase-config"]
kind = "secret"
required = true
check = "nonempty"
provider = "Supabase → Account → Access Tokens (operator only, never in CI)"

[[var]]
name = "SUPABASE_AUTH_SITE_URL"
services = ["supabase-config"]
kind = "config"
required = true
check = "https_origin"
provider = "the web origin of this environment"

[[var]]
name = "SUPABASE_AUTH_REDIRECT_URL"
services = ["supabase-config"]
kind = "config"
required = true
check = "auth_callback"
provider = "<SUPABASE_AUTH_SITE_URL>/auth/callback"

[[var]]
name = "SUPABASE_AUTH_SMTP_HOST"
services = ["supabase-config"]
kind = "config"
required = true
check = "hostname"
provider = "SMTP provider"

[[var]]
name = "SUPABASE_AUTH_SMTP_USER"
services = ["supabase-config"]
kind = "secret"
required = true
check = "nonempty"
provider = "SMTP provider"

[[var]]
name = "SUPABASE_AUTH_SMTP_PASS"
services = ["supabase-config"]
kind = "secret"
required = true
check = "nonempty"
provider = "SMTP provider (API key / SMTP password)"

[[var]]
name = "SUPABASE_AUTH_SMTP_ADMIN_EMAIL"
services = ["supabase-config"]
kind = "config"
required = true
check = "email"
provider = "sender address on the SPF/DKIM-verified domain"

[[var]]
name = "SUPABASE_AUTH_CAPTCHA_SECRET"
services = ["supabase-config"]
kind = "secret"
required = true
check = "turnstile_secret"
provider = "Cloudflare → Turnstile → the same widget's secret key; staging default: test secret 1x0000000000000000000000000000000AA"
note = "Supabase Auth verifies CAPTCHA tokens with it ([remotes.*.auth.captcha]); never on web/api/worker; test keys refused in production"

# ------------------------------------------------------------------------------------------------
# Operations (make backup / make restore)
# ------------------------------------------------------------------------------------------------
[[var]]
name = "BACKUP_DB_URL"
services = ["ops"]
kind = "secret"
check = "postgres_url"
provider = "Supabase session pooler URL (role postgres)"
note = "source of `make backup`"

[[var]]
name = "RESTORE_DB_URL"
services = ["ops"]
kind = "secret"
check = "postgres_url"
provider = "an EMPTY target at the same migration version"
note = "never the live project"
