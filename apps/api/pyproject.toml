[project]
name = "quiz-api"
version = "0.1.0"
description = "Quiz Workspace service API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn>=0.54",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.3,<4",
  "redis>=8.1,<9",
  # Producer side of the worker's job queue (M3.2a publishes document.parse); same pins as
  # apps/worker. No `celery[redis]` extra (see apps/worker/pyproject.toml).
  "celery>=5.6.3,<5.7",
  "kombu>=5.6.2,<5.7",
  "httpx>=0.28,<1",
  # Access-token verification against the Supabase Auth JWKS (ES256/RS256 via cryptography).
  "pyjwt[crypto]==2.15.1",
  # Shared core (architecture §2); the API currently uses only its stdlib log redaction.
  "book-core",
]

# Local Qwen3 query embedding (WORKER_EMBEDDER=auto/qwen3 outside APP_ENV=test, M3.6a). The
# default API image leaves it out and embeds on Cloudflare Workers AI (M7.4b);
# `--build-arg API_EXTRAS=models` builds the local-model image. Local dev gets it through the root
# dev group.
[project.optional-dependencies]
models = ["book-core[models]"]

[project.scripts]
quiz-api-openapi = "quiz_api.openapi_export:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quiz_api"
