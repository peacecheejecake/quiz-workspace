[project]
name = "quiz-api"
version = "0.1.0"
description = "Quiz Workspace service API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.143,<1",
  "uvicorn>=0.54",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.3,<4",
  "redis>=8.1,<9",
  "httpx>=0.28,<1",
  # Shared core (architecture §2); the API currently uses only its stdlib log redaction.
  "book-core",
]

[project.scripts]
quiz-api-openapi = "quiz_api.openapi_export:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quiz_api"
