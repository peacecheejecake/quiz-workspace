# Virtual uv workspace root: holds shared tooling config only, it is not a package itself.
[project]
name = "quiz-workspace"
version = "0.0.0"
description = "Quiz Workspace monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"
# Workspace members the root environment installs, so `uv sync` / `uv run` at the root can
# import, type-check and test them.
dependencies = ["quiz-api"]

[tool.uv]
package = false
# Transitive releases younger than the two-week dependency age floor (as of 2026-10-17).
# Drop each entry once the newer release has aged in.
constraint-dependencies = [
  "amqp<5.4.1",
  "billiard<4.3.1",
  "click-repl<0.4.1",
  "wcwidth<0.9.2",
]
# M1.2 parser stack: hold Docling's transitive dependencies to releases at least two weeks older
# than the Task (2026-10-17), so a fresh `uv lock` never picks up days-old versions.
exclude-newer-package = { docling-core = "2026-10-03T00:00:00Z", docling-parse = "2026-10-03T00:00:00Z", docling-ibm-models = "2026-10-03T00:00:00Z", transformers = "2026-10-03T00:00:00Z", tokenizers = "2026-10-03T00:00:00Z", numpy = "2026-10-03T00:00:00Z", pypdfium2 = "2026-10-03T00:00:00Z", rpds-py = "2026-10-03T00:00:00Z", hf-xet = "2026-10-03T00:00:00Z", shapely = "2026-10-03T00:00:00Z", rapidocr = "2026-10-03T00:00:00Z", onnxruntime = "2026-10-03T00:00:00Z", omegaconf = "2026-10-03T00:00:00Z", filelock = "2026-10-03T00:00:00Z", cuda-bindings = "2026-10-03T00:00:00Z", markupsafe = "2026-10-03T00:00:00Z", cuda-pathfinder = "2026-10-03T00:00:00Z" }

[tool.uv.workspace]
# Members are added by their Tasks (P0.6 api, P0.7 worker, P0.8 core). uv tolerates listed
# members that do not exist yet. Listed explicitly so TS-only dirs (apps/web, packages/ui,
# packages/design-tokens) are never treated as Python members.
members = ["apps/api", "apps/worker", "packages/core"]

[tool.uv.sources]
book-core = { workspace = true }
quiz-api = { workspace = true }
quiz-worker = { workspace = true }
# Docling's torch: CPU-only wheels on Linux (CI, workers) instead of the multi-GB CUDA build.
# macOS wheels on PyPI are already CPU/MPS-only.
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
  # Workspace members installed into the shared venv so pytest/mypy can import them.
  # `parser` (Docling + CPU torch) and `models` (transformers on the same torch) are part of the
  # dev install so the parser and embedding tests always run.
  "book-core[parser,models]",
  "quiz-api",
  "quiz-worker",
  # Type stubs for Celery/kombu (they ship no inline types).
  "celery-types>=0.26",
  # In-process Redis for broker transport tests (no Docker / redis-server needed).
  "fakeredis[lua]>=2.38,<2.40",
  "mypy>=2.4",
  "pytest>=9.1",
  "ruff>=0.17",
  # M1.1 synthetic PDF fixtures (packages/core/scripts/make_fixture_*.py and their tests).
  # Dev-only, never a book-core runtime dependency. reportlab and fonttools are pinned exactly
  # because their output bytes are part of the committed fixtures; pillow (pulled in by
  # reportlab) is held below 13 until that release has aged.
  "reportlab==5.0.1",
  "pypdf==6.19.0",
  "fonttools==4.66.1",
  "types-reportlab==5.0.0.20260911",
  "pillow>=12.3,<13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Markdown is excluded so tooling never rewrites the hand-written docs.
extend-exclude = [
  "node_modules", ".next", "dist", "build", "storybook-static", "*.md", ".claude",
]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT", "N", "ASYNC",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Baseline for all Python members; packages/core is fully strict (AGENTS.md §5).
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["book_core", "book_core.*"]
strict = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
# Dev-only fixture generator modules (M1.1) imported by packages/core/tests/test_fixture_pdfs.py.
pythonpath = ["packages/core/scripts"]
norecursedirs = [".*", "*.egg", "venv", "node_modules", "dist", "build"]
markers = [
  "infra: needs the local stack (`make infra-up`); skipped with a reason otherwise, run via `make test-infra`",
  "models: runs real model weights (Docling layout/TableFormer, Qwen3-Embedding; downloads into HF_HOME); excluded from `make test`, run via `make test-models` (nightly)",
]
