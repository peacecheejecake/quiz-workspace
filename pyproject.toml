# Virtual uv workspace root: holds shared tooling config only, it is not a package itself.
[project]
name = "quiz-workspace"
version = "0.0.0"
description = "Quiz Workspace monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
# Members are added by their Tasks (P0.6 api, P0.7 worker, P0.8 core). uv tolerates listed
# members that do not exist yet. Listed explicitly so TS-only dirs (apps/web, packages/ui,
# packages/design-tokens) are never treated as Python members.
members = ["apps/api", "apps/worker", "packages/core"]

[dependency-groups]
dev = [
  "mypy>=2.4",
  "pytest>=9.1",
  "ruff>=0.17",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# Markdown is excluded so tooling never rewrites the hand-written docs.
extend-exclude = ["node_modules", ".next", "dist", "build", "storybook-static", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "S", "PT", "N", "ASYNC",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101"]
"**/test_*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Baseline for all Python members; packages/core is fully strict (AGENTS.md §5).
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = ["book_core", "book_core.*"]
strict = true

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
