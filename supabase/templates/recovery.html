<!doctype html>
<html lang="ko">
  <body>
    <h2>비밀번호 재설정 / Reset your password</h2>
    <p>아래 링크를 눌러 새 비밀번호를 설정하세요. 링크는 한 번만 사용할 수 있습니다.</p>
    <p>Follow the link below to set a new password. The link can be used only once.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
        >비밀번호 재설정하기 / Reset your password</a
      >
    </p>
    <p>요청하지 않았다면 이 메일을 무시하세요. / If you did not request this, ignore this email.</p>
  </body>
</html>
